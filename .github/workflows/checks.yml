name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm run check:public
      - run: node --test scripts/prepare-partial-release.test.mjs
      - name: Scan selected source with Gitleaks
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir . --redact --no-banner
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npm audit --prefix frontend --omit=dev --audit-level=high
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend run test:unit
      - run: npm ci --prefix backend
      - run: npm audit --prefix backend --omit=dev --audit-level=high
      - run: npm --prefix backend test
      - run: npm --prefix backend run verify:fresh-install-bootstrap
      - run: npm ci --prefix mcp-review-server
      - run: npm --prefix mcp-review-server test
